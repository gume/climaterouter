name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The current tests cover the pure domain/routing layer only. Install the
      # full requirements_test.txt once Home Assistant integration tests land.
      - name: Install test tools
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Unit tests
        run: pytest
