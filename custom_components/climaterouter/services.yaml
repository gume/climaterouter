recalculate:
  name: Recalculate route
  description: Re-evaluate the route immediately, bypassing the dwell timer.
  target:
    entity:
      integration: climaterouter
      domain: climate

set_route_override:
  name: Set route override
  description: Force routing to the radiator or the AC.
  target:
    entity:
      integration: climaterouter
      domain: climate
  fields:
    route:
      name: Route
      description: Target to force.
      required: true
      example: radiator
      selector:
        select:
          options:
            - auto
            - radiator
            - ac

clear_route_override:
  name: Clear route override
  description: Return routing to automatic selection.
  target:
    entity:
      integration: climaterouter
      domain: climate

clear_conflicts:
  name: Clear conflicts
  description: Acknowledge and clear the current conflict state.
  target:
    entity:
      integration: climaterouter
      domain: climate

force_handover:
  name: Force handover
  description: Complete a pending handover immediately, without waiting for the old target to become idle.
  target:
    entity:
      integration: climaterouter
      domain: climate

set_manual_override:
  name: Set manual override
  description: Apply a temperature or preset for a bounded time, then restore the latest schedule command.
  target:
    entity:
      integration: climaterouter
      domain: climate
  fields:
    duration_minutes:
      name: Duration
      description: How long the override lasts. Defaults to the configured override duration.
      required: false
      example: 45
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    temperature:
      name: Temperature
      description: Target temperature for the override.
      required: false
      example: 22.5
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    preset_mode:
      name: Preset
      description: Preset to apply for the override.
      required: false
      example: comfort
      selector:
        text:
    hvac_mode:
      name: HVAC mode
      description: Optional mode override. Use off to cancel the override and turn the proxy off.
      required: false
      selector:
        select:
          options:
            - heat
            - cool
            - "off"

cancel_manual_override:
  name: Cancel manual override
  description: Cancel the active override and restore the latest schedule command.
  target:
    entity:
      integration: climaterouter
      domain: climate

set_boost:
  name: Set boost
  description: Activate both targets for a bounded time. Requires boost to be enabled and the proxy to be heating.
  target:
    entity:
      integration: climaterouter
      domain: climate
  fields:
    duration_minutes:
      name: Duration
      description: How long boost lasts.
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 180
          unit_of_measurement: min
          mode: box
    targets:
      name: Targets
      description: Which targets to activate. Only both is supported in this release.
      required: false
      selector:
        select:
          options:
            - both

cancel_boost:
  name: Cancel boost
  description: End boost immediately and return to normal routing.
  target:
    entity:
      integration: climaterouter
      domain: climate

lock:
  name: Lock
  description: Lock the router so user and automation commands are rejected.
  target:
    entity:
      integration: climaterouter
      domain:
        - climate
        - lock

unlock:
  name: Unlock
  description: Unlock the router. A code is required when one is configured.
  target:
    entity:
      integration: climaterouter
      domain:
        - climate
        - lock
  fields:
    code:
      name: Code
      description: The configured lock code, if any.
      required: false
      example: "1234"
      selector:
        text:
