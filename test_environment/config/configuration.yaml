# Home Assistant test configuration for ClimateRouter.
#
# Only this file (and the empty custom_components placeholder) is committed.
# Everything else in this directory is generated by Home Assistant, HACS,
# VTherm, or Scheduler and is ignored by git.

default_config:

homeassistant:
  time_zone: Europe/Amsterdam
  unit_system: metric

# ---------------------------------------------------------------------------
# Fake lab hardware
# ---------------------------------------------------------------------------
# fake_hvac is imported through its config flow from this YAML block. It creates:
#   sensor.fake_room_temperature
#   sensor.fake_outdoor_temperature
#   sensor.fake_thermal_power
#   switch.fake_radiator
#   climate.fake_ac
fake_hvac:
  name: Fake HVAC Lab
  room_temperature: 19.0
  outdoor_temperature: 6.0
  radiator_power_kw: 1.5
  ac_power_kw: 2.5
  loss_coefficient: 0.06
  thermal_mass: 0.5
  update_interval: 5
  time_scale: 60
  simulation_enabled: true

# ---------------------------------------------------------------------------
# Manual routing helpers (optional; the integration also has its own select)
# ---------------------------------------------------------------------------
input_boolean:
  climaterouter_force_ac:
    name: ClimateRouter force AC
    icon: mdi:air-conditioner

input_select:
  climaterouter_route:
    name: ClimateRouter test route
    options:
      - auto
      - radiator
      - ac
    initial: auto

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logger:
  default: info
  logs:
    custom_components.climaterouter: debug
    custom_components.fake_hvac: debug
    custom_components.versatile_thermostat: info
    homeassistant.components.climate: info

recorder:
  purge_keep_days: 3
